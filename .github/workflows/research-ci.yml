name: Synthetic research checks

on:
  pull_request:
  push:
    branches: [main, hackathon/experiment-agent]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12.3', '3.12']
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies and a clean wheel
        id: install
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install -r requirements.lock
          .ci-venv/bin/python -m pip wheel --no-deps --wheel-dir dist .
          .ci-venv/bin/python -m pip install --no-deps dist/*.whl
      - name: Run scientific software checks on synthetic data
        run: |
          mkdir -p .ci-artifacts
          .ci-venv/bin/python -I -c 'import platform, numpy, scipy; print(platform.platform(), platform.python_version()); print("NumPy", numpy.__version__, "SciPy", scipy.__version__); numpy.show_config()' > .ci-artifacts/numeric-environment.txt
          .ci-venv/bin/python -I -m pytest -q --junitxml=.ci-artifacts/tests.xml
      - name: Reproduce synthetic trajectories
        if: always() && steps.install.outcome == 'success'
        run: |
          mkdir -p .ci-artifacts
          .ci-venv/bin/python scripts/verify_reproducibility.py
          cp results/reproducibility.json .ci-artifacts/reproducibility.json
      - name: Run independent numerical checks
        if: always() && steps.install.outcome == 'success'
        run: |
          mkdir -p .ci-artifacts
          .ci-venv/bin/python scripts/verify_independent.py
          cp results/independent/c_verify_results.json .ci-artifacts/independent.json
      - name: Retain private research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-checks-py${{ matrix.python-version }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: .ci-artifacts/
