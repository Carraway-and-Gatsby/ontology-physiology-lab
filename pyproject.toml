[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-physiosim"
version = "0.1.0"
description = "Experimental ontology-guided closed-loop cardiovascular simulation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "rdflib>=7,<8", "pint>=0.24,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
physiosim = "physiosim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"physiosim.ontology" = ["*.json", "*.ttl"]
"physiosim.agent" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_tmp"
